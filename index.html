<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drystone Apps</title>
<style>
  :root { color-scheme: light dark; --bg:#faf6f0; --fg:#1d2322; --muted:#5a605c; --accent:#3a5f61; --rule:#d9d2c5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121817; --fg:#e1e3e1; --muted:#a5aaa6; --accent:#9fcfcc; --rule:#2f3735; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2.2rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 .4rem; }
  a { color: var(--accent); }
  .lead { color: var(--muted); }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; display:flex; gap:1.25rem; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
<h1>Drystone Apps</h1>
<p class="lead">Small, careful Android apps that keep your data on your device.</p>

<h2>Cairn</h2>
<p>Notes that live inside your apps. Pin a note to any app, and a small card with your notes appears
whenever you open it.</p>
<p>
  <a href="cairn/privacy/">Privacy policy / Datenschutzerklärung</a>
</p>

<footer>
  <a href="cairn/privacy/">Privacy / Datenschutz</a>
  <a href="impressum/">Impressum / Legal notice</a>
</footer>
</main>
</body>
</html>
